<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Entrenadores - Deportivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">⚽ Deportivo</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/clubes}">Clubes</a>
                <a class="nav-link active" th:href="@{/entrenadores}">Entrenadores</a>
                <a class="nav-link" th:href="@{/jugadores}">Jugadores</a>
                <a class="nav-link" th:href="@{/asociaciones}">Asociaciones</a>
                <a class="nav-link" th:href="@{/competiciones}">Competiciones</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>👨‍🏫 Lista de Entrenadores</h2>
            <a th:href="@{/entrenadores/crear}" class="btn btn-success">
                ➕ Nuevo Entrenador
            </a>
        </div>

        <!-- Mensaje si no hay registros -->
        <div th:if="${#lists.isEmpty(entrenadores)}" class="alert alert-info">
            No hay entrenadores registrados todavía.
        </div>

        <!-- Tabla de entrenadores -->
        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(entrenadores)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Nacionalidad</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entrenador, iter : ${entrenadores}">
                    <td th:text="${iter.count}"></td>
                    <td th:text="${entrenador.nombre}"></td>
                    <td th:text="${entrenador.apellido}"></td>
                    <td th:text="${entrenador.edad}"></td>
                    <td th:text="${entrenador.nacionalidad}"></td>
                    <td>
                        <a th:href="@{/entrenadores/editar/{id}(id=${entrenador.id})}"
                           class="btn btn-warning btn-sm">✏️ Editar</a>

                        <a th:href="@{/entrenadores/eliminar/{id}(id=${entrenador.id})}"
                           class="btn btn-danger btn-sm btn-eliminar"
                           th:attr="data-nombre=${entrenador.nombre + ' ' + entrenador.apellido}">
                           🗑️ Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary mt-3">⬅️ Volver al Inicio</a>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/scripts.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
