<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Competición - Deportivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">⚽ Deportivo</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/clubes}">Clubes</a>
                <a class="nav-link" th:href="@{/entrenadores}">Entrenadores</a>
                <a class="nav-link" th:href="@{/jugadores}">Jugadores</a>
                <a class="nav-link" th:href="@{/asociaciones}">Asociaciones</a>
                <a class="nav-link active" th:href="@{/competiciones}">Competiciones</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="form-container">
            <h2 class="mb-4">✏️ Editar Competición</h2>

            <form th:action="@{/competiciones/actualizar/{id}(id=${competicion.id})}"
                  th:object="${competicion}" method="post">

                <!-- Campo oculto para el ID -->
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Monto del Premio:</label>
                    <input type="number" class="form-control" th:field="*{montoPremio}"
                           min="0" step="1000" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Inicio:</label>
                    <input type="date" class="form-control" th:field="*{fechaInicio}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Fecha de Finalización:</label>
                    <input type="date" class="form-control" th:field="*{fechaFin}" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/competiciones}" class="btn btn-secondary">⬅️ Cancelar</a>
                    <button type="submit" class="btn btn-primary">💾 Actualizar</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/scripts.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
