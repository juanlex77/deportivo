<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clubes - Deportivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">⚽ Deportivo</a>
            <div class="navbar-nav">
                <a class="nav-link active" th:href="@{/clubes}">Clubes</a>
                <a class="nav-link" th:href="@{/entrenadores}">Entrenadores</a>
                <a class="nav-link" th:href="@{/jugadores}">Jugadores</a>
                <a class="nav-link" th:href="@{/asociaciones}">Asociaciones</a>
                <a class="nav-link" th:href="@{/competiciones}">Competiciones</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>🏟️ Lista de Clubes</h2>
            <a th:href="@{/clubes/crear}" class="btn btn-success">
                ➕ Nuevo Club
            </a>
        </div>

        <!-- Mensaje si no hay registros -->
        <div th:if="${#lists.isEmpty(clubes)}" class="alert alert-info">
            No hay clubes registrados todavía.
        </div>

        <!-- Tabla de clubes -->
        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(clubes)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Entrenador</th>
                    <th>Asociación</th>
                    <th>Jugadores</th>
                    <th>Competiciones</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="club, iter : ${clubes}">
                    <td th:text="${iter.count}"></td>
                    <td>
                        <strong th:text="${club.nombre}"></strong>
                    </td>
                    <td>
                        <span th:if="${club.entrenador != null}"
                              th:text="${club.entrenador.nombre + ' ' + club.entrenador.apellido}">
                        </span>
                        <span th:if="${club.entrenador == null}" class="text-muted">Sin asignar</span>
                    </td>
                    <td>
                        <span th:if="${club.asociacion != null}"
                              class="badge bg-info text-dark"
                              th:text="${club.asociacion.nombre}">
                        </span>
                        <span th:if="${club.asociacion == null}" class="text-muted">Sin asignar</span>
                    </td>
                    <td>
                        <span class="badge bg-primary"
                              th:text="${#lists.size(club.jugadores)} + ' jugador(es)'">
                        </span>
                    </td>
                    <td>
                        <span class="badge bg-warning text-dark"
                              th:text="${#lists.size(club.competiciones)} + ' competición(es)'">
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/clubes/editar/{id}(id=${club.id})}"
                           class="btn btn-warning btn-sm">✏️ Editar</a>

                        <a th:href="@{/clubes/eliminar/{id}(id=${club.id})}"
                           class="btn btn-danger btn-sm btn-eliminar"
                           th:attr="data-nombre=${club.nombre}">
                           🗑️ Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary mt-3">⬅️ Volver al Inicio</a>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/scripts.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
