<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asociaciones - Deportivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">⚽ Deportivo</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/clubes}">Clubes</a>
                <a class="nav-link" th:href="@{/entrenadores}">Entrenadores</a>
                <a class="nav-link" th:href="@{/jugadores}">Jugadores</a>
                <a class="nav-link active" th:href="@{/asociaciones}">Asociaciones</a>
                <a class="nav-link" th:href="@{/competiciones}">Competiciones</a>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>🏛️ Lista de Asociaciones</h2>
            <a th:href="@{/asociaciones/crear}" class="btn btn-success">
                ➕ Nueva Asociación
            </a>
        </div>

        <!-- Mensaje si no hay registros -->
        <div th:if="${#lists.isEmpty(asociaciones)}" class="alert alert-info">
            No hay asociaciones registradas todavía.
        </div>

        <!-- Tabla de asociaciones -->
        <table class="table table-striped table-hover" th:unless="${#lists.isEmpty(asociaciones)}">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>País</th>
                    <th>Presidente</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="asociacion, iter : ${asociaciones}">
                    <td th:text="${iter.count}"></td>
                    <td>
                        <strong th:text="${asociacion.nombre}"></strong>
                    </td>
                    <td>
                        <span class="badge bg-info text-dark"
                              th:text="${asociacion.pais}"></span>
                    </td>
                    <td th:text="${asociacion.presidente}"></td>
                    <td>
                        <a th:href="@{/asociaciones/editar/{id}(id=${asociacion.id})}"
                           class="btn btn-warning btn-sm">✏️ Editar</a>

                        <a th:href="@{/asociaciones/eliminar/{id}(id=${asociacion.id})}"
                           class="btn btn-danger btn-sm btn-eliminar"
                           th:attr="data-nombre=${asociacion.nombre}">
                           🗑️ Eliminar
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary mt-3">⬅️ Volver al Inicio</a>
    </div>

    <!-- Scripts -->
    <script th:src="@{/js/scripts.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
